[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orjev"
version = "0.1.0"
description = "Validated sequential Jev routing plans for OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "sktime303", email = "peertopeer303@gmail.com" }]
keywords = ["openrouter", "jev", "routing", "llm", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "ruff>=0.8",
]
mcp = ["mcp>=1.0"]
adapters = ["openai>=1.50", "langchain-core>=0.3"]

[project.scripts]
orjev = "orjev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orjev"]

[tool.hatch.build.targets.sdist]
include = ["src", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orjev"]
mypy_path = "src"
